
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant execute permission for gradlew
      run: chmod +x HWT_Maker_GT6/gradlew
    - name: Build APK with Gradle
      run: |
        cd HWT_Maker_GT6
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: HWT_Maker_GT6/app/build/outputs/apk/debug/app-debug.apk
